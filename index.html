<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sandeep Jadhav | DevOps & Cloud Engineer</title>
    <meta name="description" content="Portfolio of Sandeep Jadhav - DevOps & Cloud Engineer, IIT Bombay graduate with expertise in AWS, Kubernetes, CI/CD, and infrastructure automation." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      /* Prevent flash of wrong theme */
      html[data-theme="dark"], html[data-theme="dark"] body {
        background-color: #0a0a0f !important;
        color: #ffffff;
      }
      html[data-theme="light"], html[data-theme="light"] body {
        background-color: #f8fafc !important;
        color: #0f172a;
      }
    </style>
    <script>
      // Set theme before React loads to prevent flash
      (function() {
        var saved = localStorage.getItem('portfolio-theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
